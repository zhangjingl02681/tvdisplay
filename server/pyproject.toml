[project]
name = "tvdisplay"
version = "1.0.0"
description = "把图片和文字推到一台 Android 电视上的遥显服务"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.6",
    "uvicorn[standard]>=0.32.1",
    "python-multipart>=0.0.17",
    "jinja2>=3.1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "httpx2>=2.0.0",
]

[project.scripts]
tvdisplay = "tvdisplay.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["tvdisplay*"]

[tool.setuptools.package-data]
tvdisplay = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

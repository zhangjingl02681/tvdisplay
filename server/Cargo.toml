[package]
name = "tvdisplay"
version = "1.0.0"
edition = "2021"
description = "Push an image and/or text to one Android TV, with an optional Feishu bot"

[[bin]]
name = "tvdisplay"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8.9", features = ["ws", "multipart", "form"] }
axum-extra = { version = "0.12.6", features = ["cookie"] }
base64 = "0.23.1"
bytes = "1.12.2"
cookie = "0.18.3"
futures-util = "0.3.34"
hex = "0.4.3"
hmac = "0.13.0"
http = "1.5.0"
minijinja = { version = "3.1.0", features = ["serde"] }
prost = "0.14.6"
reqwest = { version = "0.13.5", default-features = false, features = ["charset", "http2", "json", "stream", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.2"
subtle = "2.6.1"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting", "parsing"] }
tokio = { version = "1.54.1", features = ["full", "test-util"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
url = "2.5.9"
uuid = { version = "1.29.3", features = ["v4"] }

[dev-dependencies]
http-body-util = "0.1.5"
reqwest = { version = "0.13.5", default-features = false, features = ["charset", "http2", "json", "stream", "rustls", "cookies", "multipart", "form"] }
tempfile = "3.27.0"

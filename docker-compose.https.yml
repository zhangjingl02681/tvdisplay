# 可选。仅当你有域名且 AAAA 记录指向树莓派时，和主文件一起用：
#   docker compose -f docker-compose.yml -f docker-compose.https.yml up -d --build
# 主服务改听 127.0.0.1:8080，由 Caddy 在 443 上提供 Let’s Encrypt 证书。
services:
  tvdisplay:
    environment:
      HOST: 127.0.0.1
      PORT: "8080"
  caddy:
    image: caddy:2
    network_mode: host
    restart: unless-stopped
    depends_on:
      - tvdisplay
    environment:
      DOMAIN: ${DOMAIN:?请在 .env 中设置 DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:

# 树莓派公网 IPv6 部署。network_mode: host 让进程直接听在宿主机的 IPv6 上。
# 不使用端口映射，也不使用任何内网穿透。
services:
  tvdisplay:
    build: .
    network_mode: host
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HOST: ${HOST:-::}
      PORT: ${PORT:-8080}
      DATA_DIR: /data
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?请在 .env 中设置 ADMIN_PASSWORD}
    volumes:
      - ./data:/data
